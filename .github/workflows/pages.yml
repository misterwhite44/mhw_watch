# Chaque jour : télécharge les dernières données NOAA, relance la détection sur toutes les AMP,
# envoie une alerte si une AMP entre en catégorie II ou plus, et publie le tableau de bord (version HTML statique) sur GitHub Pages.
# Prérequis (une seule fois) : Settings > Pages > Source = « GitHub Actions ».
name: Mise à jour quotidienne

on:
  schedule:
    - cron: "30 6 * * *" # 06:30 UTC
  workflow_dispatch: # bouton « Run workflow » dans l'onglet Actions

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install .

      # Années complètes déjà téléchargées depuis NOAA PSL (source de secours, lente).
      - uses: actions/cache@v4
        with:
          path: data/psl
          key: psl-${{ github.run_id }}
          restore-keys: psl-

      - name: Analyse de toutes les AMP
        run: mhw-watch analyze --site all

      # Mémoire des alertes déjà envoyées, pour n'alerter qu'à l'entrée en catégorie II+.
      - uses: actions/cache@v4
        with:
          path: alerts
          key: alerts-${{ github.run_id }}
          restore-keys: alerts-

      # Chaque canal n'est actif que si ses secrets existent (Settings > Secrets > Actions).
      # Un échec d'envoi est signalé mais n'empêche pas la publication du site.
      - name: Alertes catégorie II+
        continue-on-error: true
        run: mhw-watch alert --out outputs --state alerts/state.json
        env:
          MHW_WATCH_SMTP_HOST: ${{ secrets.MHW_WATCH_SMTP_HOST }}
          MHW_WATCH_SMTP_PORT: ${{ secrets.MHW_WATCH_SMTP_PORT }}
          MHW_WATCH_SMTP_USER: ${{ secrets.MHW_WATCH_SMTP_USER }}
          MHW_WATCH_SMTP_PASSWORD: ${{ secrets.MHW_WATCH_SMTP_PASSWORD }}
          MHW_WATCH_ALERT_EMAIL_FROM: ${{ secrets.MHW_WATCH_ALERT_EMAIL_FROM }}
          MHW_WATCH_ALERT_EMAIL_TO: ${{ secrets.MHW_WATCH_ALERT_EMAIL_TO }}
          MHW_WATCH_BLUESKY_HANDLE: ${{ secrets.MHW_WATCH_BLUESKY_HANDLE }}
          MHW_WATCH_BLUESKY_APP_PASSWORD: ${{ secrets.MHW_WATCH_BLUESKY_APP_PASSWORD }}
          MHW_WATCH_MASTODON_INSTANCE: ${{ secrets.MHW_WATCH_MASTODON_INSTANCE }}
          MHW_WATCH_MASTODON_TOKEN: ${{ secrets.MHW_WATCH_MASTODON_TOKEN }}

      - name: Export du site statique
        run: mhw-watch export-site --out outputs --dest site

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
